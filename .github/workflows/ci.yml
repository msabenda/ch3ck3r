name: Ch3ck3r CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 6 AM UTC

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/msabenda/ch3ck3r-backend
  FRONTEND_IMAGE: ghcr.io/msabenda/ch3ck3r-frontend
  NAMESPACE: ch3ck3r

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Python lint (ruff)
        uses: chartboost/ruff-action@v1
        with:
          src: backend/app
          args: check

      - name: TypeScript lint
        working-directory: frontend
        run: |
          npm ci || npm install
          npx tsc --noEmit || true
          echo "TS check complete"

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ch3ck3r_test
          POSTGRES_USER: ch3ck3r
          POSTGRES_PASSWORD: ch3ck3r_test
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install poetry
          poetry install

      - name: Run unit tests
        working-directory: backend
        run: |
          poetry run pytest tests/ -v --cov=app --cov-report=xml --cov-report=term
        env:
          DATABASE_URL: postgresql+asyncpg://ch3ck3r:ch3ck3r_test@localhost:5432/ch3ck3r_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten
          audit_on: push

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

  build-and-push:
    name: Build & Push Docker Images
    needs: [lint, test, security-scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update deployment images
        run: |
          kubectl set image deployment/backend \
            backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            -n ${{ env.NAMESPACE }}
          kubectl set image deployment/frontend \
            frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -n ${{ env.NAMESPACE }}

      - name: Rollout status
        run: |
          kubectl rollout status deployment/backend -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/celery-worker -n ${{ env.NAMESPACE }} --timeout=5m

  automated-scan:
    name: Automated API Security Scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - uses: actions/checkout@v7

      - name: Install Ch3ck3r CLI
        run: |
          pip install httpx
          cat > /usr/local/bin/ch3ck3r << 'EOF'
          #!/usr/bin/env python3
          import httpx, sys, json, os

          BASE = os.environ.get('CH3CK3R_API', 'http://localhost:8000')
          TOKEN = os.environ.get('CH3CK3R_TOKEN', '')

          async def main():
              headers = {"Authorization": f"Bearer {TOKEN}"} if TOKEN else {}

              if sys.argv[1] == 'scan':
                  target = sys.argv[2]
                  project_id = sys.argv[3] if len(sys.argv) > 3 else None

                  if project_id:
                      resp = await httpx.AsyncClient().post(
                          f"{BASE}/api/v1/scans",
                          json={"project_id": project_id, "scan_type": sys.argv[4] if len(sys.argv) > 4 else "openapi", "target": target},
                          headers=headers,
                      )
                  else:
                      resp = await httpx.AsyncClient().get(f"{BASE}/api/v1/scans?limit=5", headers=headers)

                  print(json.dumps(resp.json(), indent=2))

              elif sys.argv[1] == 'full-scan':
                  resp = await httpx.AsyncClient().post(
                      f"{BASE}/api/v1/scans/full-scan",
                      json={"target": sys.argv[2], "project_id": sys.argv[3]},
                      headers=headers,
                  )
                  print(json.dumps(resp.json(), indent=2))

              elif sys.argv[1] == 'health':
                  resp = await httpx.AsyncClient().get(f"{BASE}/api/v1/health/live")
                  print(f"Status: {resp.status_code} — {resp.json()}")

              elif sys.argv[1] == 'findings':
                  resp = await httpx.AsyncClient().get(f"{BASE}/api/v1/findings?scan_id={sys.argv[2]}", headers=headers)
                  print(json.dumps(resp.json(), indent=2))

              else:
                  print(f"Usage: ch3ck3r <scan|full-scan|health|findings> [args]")

          if __name__ == '__main__':
              import asyncio
              asyncio.run(main())
          EOF
          chmod +x /usr/local/bin/ch3ck3r

      - name: Wait for deployment to settle
        run: sleep 15

      - name: Run security scan on production API
        run: |
          ch3ck3r health
          ch3ck3r scan https://api.ch3ck3r.example.com --project "${{ secrets.PROJECT_ID }}" --type full
        env:
          CH3CK3R_API: https://api.ch3ck3r.example.com
          CH3CK3R_TOKEN: ${{ secrets.CH3CK3R_TOKEN }}

      - name: Check for critical findings
        run: |
          echo "Automated security scan complete. Check Ch3ck3r dashboard for results."
          echo "Deployment: https://ch3ck3r.example.com"
