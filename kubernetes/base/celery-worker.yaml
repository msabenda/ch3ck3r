# Ch3ck3r — Celery Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  labels:
    app.kubernetes.io/name: ch3ck3r
    app.kubernetes.io/component: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ch3ck3r
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ch3ck3r
        app.kubernetes.io/component: celery-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: worker
          image: ghcr.io/msabenda/ch3ck3r-backend:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - app.tasks
            - worker
            - --loglevel=info
            - --concurrency=4
            - --max-tasks-per-child=50
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ch3ck3r-secrets
                  key: secret-key
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ch3ck3r-secrets
                  key: postgres-password
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 4
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.tasks
                - status
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: celery-worker
  labels:
    app.kubernetes.io/name: ch3ck3r
    app.kubernetes.io/component: celery-worker
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: metrics
  selector:
    app.kubernetes.io/name: ch3ck3r
    app.kubernetes.io/component: celery-worker
