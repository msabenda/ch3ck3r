# Ch3ck3r — Ingress, network policy, and autoscaling
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ch3ck3r-network-policy
  labels:
    app.kubernetes.io/name: ch3ck3r
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ch3ck3r
      ports:
        - port: 8000
        - port: 3000
        - port: 5432
        - port: 6379
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
        - port: 3000
  egress:
    - to:
        - podSelector: {}
      ports:
        - port: 5432
        - port: 6379
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
        - port: 80
        - port: 53
          protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ch3ck3r-ingress
  labels:
    app.kubernetes.io/name: ch3ck3r
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://ch3ck3r.example.com"
    # Rate limiting per IP via nginx
    nginx.ingress.kubernetes.io/limit-rps: "20"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ch3ck3r.example.com
        - api.ch3ck3r.example.com
      secretName: ch3ck3r-tls
  rules:
    - host: ch3ck3r.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: api.ch3ck3r.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  labels:
    app.kubernetes.io/name: ch3ck3r
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-worker-hpa
  labels:
    app.kubernetes.io/name: ch3ck3r
    app.kubernetes.io/component: celery-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
