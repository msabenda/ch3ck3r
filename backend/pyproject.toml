[tool.poetry]
name = "ch3ck3r-backend"
version = "0.1.0"
description = "API Misconfiguration Scanner"
authors = ["Remnant"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109"
uvicorn = {extras = ["standard"], version = "^0.27"}
pydantic = "^2.5"
pydantic-settings = "^2.1"
sqlalchemy = "^2.0"
asyncpg = "^0.29"
alembic = "^1.13"
redis = "^5.0"
httpx = "^0.26"
pyyaml = "^6.0"
python-jose = {extras = ["cryptography"], version = "^3.3"}
passlib = {extras = ["bcrypt"], version = "^1.7"}
python-multipart = "^0.0"
celery = "^5.3"
httptools = "^0.6"
python-dotenv = "^1.0"
jinja2 = "^3.1"
weasyprint = "^60"
semgrep = "^1.60"
orjson = "^3.9"
prometheus-client = "^0.19"
strawberry-graphql = {extras = ["fastapi"], version = "^0.220"}
python-json-logger = "^2.0"
aiofiles = "^23.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
black = "^23.12"
ruff = "^0.1"
mypy = "^1.8"
httpx = "^0.26"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
