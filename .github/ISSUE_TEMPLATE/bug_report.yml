name: Bug report
description: Report a reproducible Ch3ck3r problem
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not disclose vulnerabilities or real secrets here. Use private vulnerability reporting.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [VS Code extension, Local SAST rules, Reports/SARIF, Backend, Dashboard, Packaging/CI, Documentation]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic and redacted examples only.
      placeholder: "1. Open…\n2. Run…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Ch3ck3r, VS Code, Node.js, operating system
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: shell
